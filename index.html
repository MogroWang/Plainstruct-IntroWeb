<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>来认识一下『素构 Plainstruct』。</title>
  <meta name="description" content="素构 Plainstruct 是一个本地运行的静态文档网站创建器。在文件夹里写 Markdown，一键构建、本地预览、发布到 GitHub Pages——不需要命令行，不需要后端。">
  <meta name="theme-color" content="#f7f7f7">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    /* one material decision: a neutral gray-white field with a single ink
   accent - the brand's own rule. type is each platform's native system
   sans; hierarchy comes from size, weight and whitespace only. no
   gradients, no glow, 8px radii, 4px grid, one easing curve. */
    :root {
      --ink: #1d1d1d;
      --muted: #555555;
      --faint: #8c8c8c;
      --rule: #e6e6e6;
      --paper: #f7f7f7;
      --white: #ffffff;
      --measure: 76ch;
      --fig: 840px;
      --sans: "Segoe UI Variable", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "PingFang SC", "Microsoft YaHei", monospace;
      --ease: cubic-bezier(.23, 1, .32, 1);
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: none
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 18px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-optical-sizing: auto;
      touch-action: manipulation;
      cursor: default;
      caret-color: transparent
    }

    /* keep text selectable, but drop the I-beam text cursor */
    a,
    button,
    input,
    select,
    textarea,
    [role="button"] {
      cursor: pointer
    }

    a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--ink) 32%, transparent);
      transition: color 200ms var(--ease), border-color 200ms var(--ease)
    }

    a:hover {
      color: #000;
      border-bottom-color: #000
    }

    a:active {
      color: #000
    }

    img {
      max-width: 100%;
      display: block
    }

    p {
      margin: 0;
      white-space: pre-wrap
    }

    /* top bar: logo + a few icons. no link list. a gradient blur layer
   (::before) replaces the opaque strip - content scrolling under the bar
   dissolves into blur instead of hitting a hard divider. after a 5% dead
   zone the bar shrinks into a floating glass card with 8px corners. */
    .bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: transparent
    }

    .bar::before {
      content: '';
      position: absolute;
      top: -50px;
      left: 0;
      right: 0;
      bottom: -100px;
      background: color-mix(in srgb, var(--paper) 85%, transparent);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(15px) saturate(200%);
      -webkit-mask-image: linear-gradient(to bottom, black 0%, rgba(0, 0, 0) 45%, rgba(0, 0, 0, .30) 85%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 0%, rgba(0, 0, 0) 45%, rgba(0, 0, 0, .30) 85%, transparent 100%);
      z-index: -1;
      pointer-events: none;
      transition: background .35s var(--ease)
    }

    .bar-in {
      position: relative;
      z-index: 1;
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 28px;
      height: 60px;
      border: 1px solid transparent;
      box-shadow: 0 0 0 0 transparent;
      transform: translateY(0);
      display: flex;
      align-items: center;
      gap: 20px;
      contain: layout;
      will-change: transform, max-width, height;
      transition: max-width .35s var(--ease), height .35s var(--ease), padding .35s var(--ease), border-radius .35s var(--ease), border-color .35s var(--ease), background .35s var(--ease), box-shadow .35s var(--ease), transform .35s var(--ease)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--ink);
      border-bottom: 0;
      transition: color 200ms var(--ease), opacity 200ms var(--ease)
    }

    .brand:active {
      opacity: .7
    }

    .brand img {
      height: 38px;
      width: auto;
      transition: height .35s var(--ease), transform .3s var(--ease)
    }

    .brand:hover img {
      transform: scale(1.04)
    }

    .bar-r {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 16px
    }

    .lang {
      position: relative;
      display: flex
    }

    .lang>button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 0;
      background: none;
      padding: 0;
      color: var(--faint);
      cursor: pointer;
      font-family: inherit;
      border-radius: 8px;
      transition: color 200ms var(--ease), background-color 200ms var(--ease), transform 100ms var(--ease)
    }

    .lang>button svg {
      width: 18px;
      height: 18px;
      display: block
    }

    .lang>button:hover {
      color: var(--ink);
      background: color-mix(in srgb, var(--ink) 6%, transparent)
    }

    .lang>button:active {
      transform: scale(.92);
      background: color-mix(in srgb, var(--ink) 8%, transparent)
    }

    /* dropdown menu: a translucent card that materializes from the trigger,
   scaling out of its top-right origin and fading in together. */
    .lang-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 160px;
      padding: 6px;
      box-sizing: border-box;
      background: color-mix(in srgb, var(--white) 86%, transparent);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid var(--rule);
      border-radius: 8px;
      box-shadow: 0 16px 36px rgb(0 0 0 / 14%);
      transform-origin: top right;
      visibility: hidden;
      opacity: 0;
      transform: scale(.92) translateY(-4px);
      transition: opacity .18s var(--ease), transform .25s var(--ease), visibility 0s linear .25s;
      z-index: 60
    }

    .lang-menu.open {
      visibility: visible;
      opacity: 1;
      transform: scale(1) translateY(0);
      transition: opacity .18s var(--ease), transform .25s var(--ease), visibility 0s
    }

    .lang-menu button {
      display: flex;
      width: 100%;
      height: auto;
      padding: 8px 12px;
      border: 0;
      background: none;
      font-size: 14px;
      color: var(--ink);
      cursor: pointer;
      font-family: inherit;
      border-radius: 4px;
      transition: background-color 200ms var(--ease)
    }

    .lang-menu button.on {
      font-weight: 700;
      color: var(--ink)
    }

    .lang-menu button:hover {
      background: color-mix(in srgb, var(--ink) 6%, transparent)
    }

    .lang-menu button:active {
      background: color-mix(in srgb, var(--ink) 10%, transparent)
    }

    .icon-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 0;
      background: none;
      padding: 0;
      color: var(--faint);
      cursor: pointer;
      font-family: inherit;
      border-radius: 8px;
      transition: color 200ms var(--ease), background-color 200ms var(--ease), transform 100ms var(--ease)
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      display: block
    }

    .icon-btn:hover {
      color: var(--ink);
      background: color-mix(in srgb, var(--ink) 6%, transparent)
    }

    .icon-btn:active {
      transform: scale(.92);
      background: color-mix(in srgb, var(--ink) 8%, transparent)
    }

    /* tooltip: a small ink pill that fades in below the trigger on hover/focus */
    .icon-btn .tip,
    .lang>button .tip {
      position: absolute;
      top: calc(100% + 8px);
      right: 50%;
      transform: translate(50%, 4px);
      white-space: nowrap;
      padding: 5px 10px;
      font-size: 12.5px;
      font-weight: 500;
      color: #fff;
      background: color-mix(in srgb, var(--ink) 90%, transparent);
      box-shadow: 0 6px 16px rgb(0 0 0 / 22%);
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s var(--ease), transform .15s var(--ease);
      z-index: 70
    }

    .icon-btn:hover .tip,
    .icon-btn:focus-visible .tip,
    .lang>button:hover .tip,
    .lang>button:focus-visible .tip {
      opacity: 1;
      transform: translate(50%, 0)
    }

    /* hide the tooltip while the language menu is open */
    .lang:has(.lang-menu.open) .tip {
      opacity: 0
    }

    /* scrolled: shrink into a centered floating card */
    .bar.scrolled {
      background: transparent
    }

    .bar.scrolled::before {
      background: color-mix(in srgb, var(--paper) 50%, transparent)
    }

    .bar.scrolled .bar-in {
      max-width: min(520px, calc(100% - 28px));
      height: 48px;
      padding: 0 20px;
      border-radius: 8px;
      border-color: var(--rule);
      background: color-mix(in srgb, var(--white) 80%, transparent);
      box-shadow: 0 14px 30px rgb(0 0 0 / 12%);
      transform: translateY(10px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      backdrop-filter: saturate(180%) blur(16px)
    }

    .bar.scrolled .brand img {
      height: 30px
    }

    @media (prefers-reduced-motion:reduce) {

      .bar,
      .bar-in,
      .brand img,
      .bar::before {
        transition: none
      }

      .lang-menu {
        transform: none;
        transition: opacity 150ms ease
      }
    }

    @media (prefers-reduced-transparency:reduce) {
      .bar::before {
        background: var(--paper);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        -webkit-mask-image: none;
        mask-image: none
      }

      .bar.scrolled .bar-in {
        background: var(--white);
        -webkit-backdrop-filter: none;
        backdrop-filter: none
      }

      .lang-menu {
        background: var(--white);
        -webkit-backdrop-filter: none;
        backdrop-filter: none
      }
    }

    @media (prefers-contrast:more) {
      .bar::before {
        background: var(--white);
        -webkit-mask-image: none;
        mask-image: none
      }

      .bar.scrolled .bar-in {
        background: var(--white);
        border-color: var(--ink)
      }

      a {
        border-bottom-color: var(--ink)
      }

      .dl a {
        border-bottom-color: var(--ink)
      }
    }

    /* layout: a single centered column. figures break out a little wider. */
    main {
      max-width: var(--measure);
      margin: 0 auto;
      padding: 144px 40px 40px;
      transition: opacity .2s var(--ease), transform .2s var(--ease)
    }

    main.switching {
      opacity: 0;
      transform: translateY(8px)
    }

    .figure {
      max-width: var(--fig);
      margin: 56px auto
    }

    figure {
      margin: 0
    }

    figure img {
      width: 100%;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: var(--white);
      box-shadow: 0 16px 32px rgb(0 0 0 / 10%)
    }

    figcaption {
      margin-top: 20px;
      font-size: 13.5px;
      color: var(--faint);
      line-height: 1.5;
      text-align: center;
      letter-spacing: .005em
    }

    /* type scale with real contrast; no kickers, no all-caps. */
    h1 {
      font-weight: 800;
      letter-spacing: -.025em;
      line-height: 1.12;
      font-size: clamp(58px, 7.8vw, 76px);
      margin: 0 0 24px;
      text-wrap: balance;
      text-align: center
    }

    .lead {
      font-size: 21px;
      color: var(--muted);
      line-height: 1.7;
      text-align: center;
      white-space: pre-wrap
    }

    /* Chinese optically corrects for the trailing full-width period: the
   centered line reads shifted left by half a full-width box, so nudge it
   right by one half-width (0.5em). english needs no correction. */
    body.lang-zh h1,
    body.lang-zh .lead,
    body.lang-zh figcaption {
      padding-left: .5em
    }

    /* primary action pair: a filled Download and a plain GitHub link.
   instant press feedback, 8px corners, restrained shadow lift. */
    .cta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin: 32px 0 0
    }

    .cta a {
      display: inline-flex;
      align-items: center
    }

    /* balance the pair: give the text link equal optical weight to the button */
    .cta a:not(.btn) {
      font-size: 16px;
      font-weight: 600;
      padding: 0 4px;
      line-height: 1;
      border-bottom: 0;
      gap: 6px
    }

    .cta a:not(.btn) svg {
      width: 15px;
      height: 15px;
      flex: none
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 48px;
      padding: 0 28px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      transition: transform .1s var(--ease), background-color .2s var(--ease), box-shadow .2s var(--ease), color .2s var(--ease)
    }

    .btn:active {
      transform: scale(.97)
    }

    .btn:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px
    }

    .btn-primary {
      background: var(--ink);
      color: #fff;
      box-shadow: 0 8px 20px rgb(0 0 0 / 20%)
    }

    .btn-primary:hover {
      background: #000;
      color: #fff;
      border-color: transparent;
      box-shadow: 0 12px 24px rgb(0 0 0 / 24%)
    }

    h2 {
      font-weight: 700;
      letter-spacing: -.012em;
      line-height: 1.25;
      font-size: clamp(24px, 3vw, 32px);
      margin: 88px 0 16px;
      text-wrap: balance
    }

    h2:first-of-type {
      margin-top: 88px
    }

    p+p {
      margin-top: 20px
    }

    .prose p {
      color: var(--ink)
    }

    .prose p+p {
      color: var(--muted)
    }

    .prose code {
      font-family: var(--mono);
      font-size: .86em;
      padding: 1px 6px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--ink) 6%, transparent)
    }

    /* a real list where a list is the right shape; no card grid. */
    ul.items {
      list-style: none;
      margin: 20px 0 0;
      padding: 0
    }

    ul.items li {
      padding: 16px 0;
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 8px 24px;
      align-items: baseline
    }

    ul.items li:last-child {
      border-bottom: 1px solid var(--rule)
    }

    ul.items b {
      font-weight: 650;
      font-size: 16px
    }

    ul.items span {
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.55;
      letter-spacing: .003em
    }

    /* downloads: a plain list of links, not equal cards. */
    .dl {
      margin: 20px 0 0;
      border-top: 1px solid var(--rule)
    }

    .dl a {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 17px 0;
      border-bottom: 1px solid var(--rule);
      color: var(--ink);
      font-weight: 600;
      font-size: 16px;
      transition: color 200ms var(--ease), background-color 200ms var(--ease), transform 100ms var(--ease)
    }

    .dl a:hover {
      color: #000
    }

    .dl a:active {
      transform: scale(.985);
      background-color: color-mix(in srgb, var(--ink) 4%, transparent)
    }

    .dl a .v {
      margin-left: auto;
      color: var(--faint);
      font-weight: 400;
      font-size: 13.5px;
      letter-spacing: .005em
    }

    /* footer: one line, two halves. */
    footer {
      max-width: 1040px;
      margin: 120px auto 0;
      padding: 32px 40px 48px;
      border-top: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 13.5px;
      color: var(--faint)
    }

    footer a {
      color: var(--muted);
      font-weight: 500
    }

    footer .links {
      display: flex;
      gap: 18px
    }

    /* studio sign-off: the wordmark sits centered under the footer row.
   hovering softly defocuses it while a line of ink text fades in over
   its center, naming the destination. */
    footer .studio-mark {
      position: relative;
      flex: 1 1 100%;
      display: flex;
      justify-content: center;
      margin-top: 32px;
      border-bottom: 0;
      color: inherit
    }

    footer .studio-mark .mark-hint {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + 5px));
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .01em;
      line-height: 1;
      color: var(--ink);
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s var(--ease), transform .35s var(--ease)
    }

    footer .studio-mark:hover .mark-hint,
    footer .studio-mark:focus-visible .mark-hint {
      opacity: 1;
      transform: translate(-50%, -50%)
    }

    footer .studio-mark img {
      display: block;
      height: 20px;
      width: auto;
      opacity: .8;
      filter: grayscale(1);
      transition: filter .55s var(--ease), opacity .55s var(--ease), transform .55s var(--ease)
    }

    footer .studio-mark:hover img,
    footer .studio-mark:focus-visible img {
      filter: grayscale(1) blur(5px);
      opacity: .55;
      transform: scale(1.03)
    }

    footer .studio-mark:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 6px;
      border-radius: 4px
    }

    @media (prefers-reduced-motion:reduce) {
      footer .studio-mark img {
        transition: none
      }
    }

    /* one subtle reveal: opacity + small translate, standard ease. */
    [data-reveal] {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .6s var(--ease), transform .6s var(--ease);
      transition-delay: calc(var(--i, 0)*80ms);
      will-change: transform, opacity
    }

    [data-reveal].in {
      opacity: 1;
      transform: none;
      will-change: auto
    }

    /* pull-to-refresh: a progress ring that fills as you pull. once the user
   holds still past the threshold it morphs into a pill prompting release.
   touch-only. */
    .ptr {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--ptr, 0px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 200;
      pointer-events: none;
      transition: height .3s cubic-bezier(.23, 1, .32, 1)
    }

    body.ptr-dragging .ptr {
      transition-duration: 0s
    }

    .ptr-inner {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      margin-bottom: 14px;
      overflow: hidden;
      border-radius: 8px;
      background: color-mix(in srgb, var(--white) 88%, transparent);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 26px rgb(0 0 0 / 16%);
      opacity: 0;
      transform: translateY(10px) scale(.9);
      transition: opacity .25s var(--ease), transform .25s var(--ease), width .32s var(--ease)
    }

    body.ptr-active .ptr-inner {
      opacity: 1;
      transform: translateY(0) scale(1)
    }

    body.ptr-hold .ptr-inner {
      width: 140px
    }

    .ptr-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
      transition: opacity .2s var(--ease)
    }

    body.ptr-hold .ptr-ring {
      opacity: 0
    }

    .ptr-ring .track {
      fill: none;
      stroke: color-mix(in srgb, var(--ink) 20%, transparent);
      stroke-width: 2.5
    }

    .ptr-ring .block,
    .ptr-ring .base {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .ptr-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      opacity: 0;
      transition: opacity .2s var(--ease)
    }

    body.ptr-hold .ptr-label {
      opacity: 1
    }

    @media (prefers-reduced-motion:reduce) {
      [data-reveal] {
        opacity: 1;
        transform: none;
        transition: none
      }

      main {
        transition: opacity .15s ease
      }

      main.switching {
        transform: none
      }

      .ptr {
        transition: none
      }

      .ptr-inner {
        transition: opacity .15s ease
      }

      .ptr-ring,
      .ptr-label {
        transition: opacity .15s ease
      }

      html {
        scroll-behavior: auto
      }
    }

    @media (max-width:680px) {
      main {
        padding: 104px 22px 24px
      }

      h1 {
        margin: 28px 0 24px
      }

      .figure {
        margin: 40px 0
      }

      ul.items li {
        grid-template-columns: 1fr
      }

      .bar-in {
        max-width: 100%
      }

      .bar.scrolled .bar-in {
        max-width: calc(100% - 28px)
      }
    }

    /* ambient background: a quiet loop of gray ripples, a self-drawing
   document (three writing lines) and a self-drawing structure (the
   logo's stacked blocks), all behind the content and barely there.
   pure CSS, pointer-events off, hidden under prefers-reduced-motion. */
    .bg-fx {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none
    }

    .bg-fx i,
    .bg-fx svg {
      position: absolute;
      display: block
    }

    .fx-spot {
      width: 480px;
      height: 480px
    }

    .fx-spot.fx-a {
      left: 7vw;
      top: 30vh;
      animation: fx-drift-a 58s ease-in-out infinite
    }

    .fx-spot.fx-b {
      left: 93vw;
      top: 68vh;
      animation: fx-drift-b 47s ease-in-out infinite;
      animation-delay: -19s
    }

    /* each layer wanders along its own closed loop; the coprime periods
       keep the combination from ever settling into a visible pattern */
    @keyframes fx-drift-a {
      0% {
        transform: translate(calc(-50% - 1.6vw), calc(-50% + 1.2vh))
      }

      25% {
        transform: translate(calc(-50% + 1.8vw), calc(-50% + 2.6vh))
      }

      50% {
        transform: translate(calc(-50% + 2.6vw), calc(-50% - 1.8vh))
      }

      75% {
        transform: translate(calc(-50% - 2.2vw), calc(-50% - 2.4vh))
      }

      100% {
        transform: translate(calc(-50% - 1.6vw), calc(-50% + 1.2vh))
      }
    }

    @keyframes fx-drift-b {
      0% {
        transform: translate(calc(-50% + 1.4vw), calc(-50% - 2.2vh))
      }

      30% {
        transform: translate(calc(-50% - 2.4vw), calc(-50% - .8vh))
      }

      60% {
        transform: translate(calc(-50% - 1vw), calc(-50% + 2.8vh))
      }

      85% {
        transform: translate(calc(-50% + 2.2vw), calc(-50% + 1vh))
      }

      100% {
        transform: translate(calc(-50% + 1.4vw), calc(-50% - 2.2vh))
      }
    }

    .fx-spot i {
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid color-mix(in srgb, var(--ink) 30%, transparent);
      opacity: 0;
      animation: fx-ripple 10s cubic-bezier(.23, 1, .32, 1) infinite
    }

    .fx-spot i:nth-child(2) {
      animation-delay: -3.33s
    }

    .fx-spot i:nth-child(3) {
      animation-delay: -6.66s
    }

    @keyframes fx-ripple {
      0% {
        transform: scale(.22);
        opacity: 0
      }

      12% {
        opacity: .3
      }

      100% {
        transform: scale(1);
        opacity: 0
      }
    }

    /* 素: three writing lines drawing themselves, then fading */
    .fx-md {
      right: 7vw;
      top: 19vh;
      width: 150px;
      height: 100px;
      opacity: .18;
      animation: fx-drift-md 51s ease-in-out infinite;
      animation-delay: -13s
    }

    @keyframes fx-drift-md {
      0% {
        transform: translate(0, 0) rotate(-4deg)
      }

      35% {
        transform: translate(-2.2vw, 1.8vh) rotate(-7deg)
      }

      65% {
        transform: translate(-1vw, 3vh) rotate(-2deg)
      }

      85% {
        transform: translate(-2.8vw, -1.6vh) rotate(-5deg)
      }

      100% {
        transform: translate(0, 0) rotate(-4deg)
      }
    }

    .fx-md path {
      stroke: color-mix(in srgb, var(--ink) 60%, transparent);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: fx-write 11s cubic-bezier(.3, .1, .3, .95) infinite
    }

    .fx-md path:nth-child(2) {
      animation-delay: 1s
    }

    .fx-md path:nth-child(3) {
      animation-delay: 2s
    }

    @keyframes fx-write {
      0% {
        stroke-dashoffset: 1;
        opacity: 0
      }

      3% {
        opacity: 1
      }

      14% {
        stroke-dashoffset: 0
      }

      74% {
        stroke-dashoffset: 0;
        opacity: 1
      }

      82% {
        opacity: 0
      }

      100% {
        stroke-dashoffset: 1;
        opacity: 0
      }
    }

    /* 构: the logo's stacked blocks drawing themselves, then fading */
    .fx-blocks {
      left: 8vw;
      top: 66vh;
      width: 110px;
      height: 90px;
      opacity: .2;
      animation: fx-drift-blocks 38s ease-in-out infinite;
      animation-delay: -7s
    }

    @keyframes fx-drift-blocks {
      0% {
        transform: translate(0, 0) rotate(0deg)
      }

      30% {
        transform: translate(1.6vw, -2.2vh) rotate(3deg)
      }

      55% {
        transform: translate(2.6vw, 1.4vh) rotate(5deg)
      }

      80% {
        transform: translate(-1vw, 2.4vh) rotate(1deg)
      }

      100% {
        transform: translate(0, 0) rotate(0deg)
      }
    }

    .fx-blocks path {
      stroke: color-mix(in srgb, var(--ink) 60%, transparent);
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: fx-raise 12s cubic-bezier(.45, .05, .35, .95) infinite
    }

    .fx-blocks path:nth-child(2) {
      animation-delay: .6s
    }

    .fx-blocks path:nth-child(3) {
      animation-delay: 1.2s
    }

    .fx-blocks path:nth-child(4) {
      animation-delay: 1.8s
    }

    @keyframes fx-raise {
      0% {
        stroke-dashoffset: 1;
        opacity: 0
      }

      5% {
        opacity: 1
      }

      16% {
        stroke-dashoffset: 0
      }

      36% {
        stroke-dashoffset: 0;
        opacity: 1
      }

      48% {
        stroke-dashoffset: 1;
        opacity: 1
      }

      54%,
      100% {
        stroke-dashoffset: 1;
        opacity: 0
      }
    }

    @media (max-width:900px) {

      .fx-md,
      .fx-blocks {
        display: none
      }

      .fx-spot {
        width: 320px;
        height: 320px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .bg-fx {
        display: none
      }
    }

      var io = typeof IntersectionObserver !== "undefined" && !reduce
        ? new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
          });
        }, { threshold: 0.15, rootMargin: "0px 0px -6% 0px" })
        : null;
      document.querySelectorAll("[data-reveal]").forEach(function (el) {
        if (io) { io.observe(el); } else { el.classList.add("in"); }
      });

      function applyLang(lang, animate) {
        var swap = function () {
          document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
          document.body.classList.toggle("lang-zh", lang !== "en");
          document.title = lang === "en" ? "Introducing Plainstruct." : "来认识一下『素构 Plainstruct』。";
          document.querySelectorAll("[data-zh]").forEach(function (el) {
            var txt = lang === "en" ? el.getAttribute("data-en") : el.getAttribute("data-zh");
            if (txt == null) return;
            if (txt.indexOf("<") !== -1) { el.innerHTML = txt; }
            else { el.textContent = txt; }
          });
          document.querySelectorAll(".lang-menu button").forEach(function (b) {
            b.classList.toggle("on", b.getAttribute("data-lang") === lang);
          });
          try { localStorage.setItem("plainstruct-intro-lang", lang); } catch (e) { }
        };
        var main = document.querySelector("main");
        if (!animate || reduce || !main) { swap(); return; }
        main.classList.add("switching");
        setTimeout(function () {
          swap();
          requestAnimationFrame(function () {
            main.classList.remove("switching");
          });
          /* safety net: never leave the page hidden when rAF is throttled
             (backgrounded tabs pause animation frames) */
          setTimeout(function () { main.classList.remove("switching"); }, 600);
        }, 200);
      }
      var saved = null;
      try { saved = localStorage.getItem("plainstruct-intro-lang"); } catch (e) { }
      applyLang(saved === "en" || saved === "zh" ? saved : "zh", false);

      var sw = document.getElementById("langSwitch");
      var menu = document.getElementById("langMenu");
      function setMenu(open) {
        if (!menu) return;
        menu.classList.toggle("open", open);
        if (sw) { sw.setAttribute("aria-expanded", open ? "true" : "false"); }
      }
      if (sw && menu) {
        sw.addEventListener("click", function (e) {
          e.stopPropagation();
          setMenu(!menu.classList.contains("open"));
        });
        menu.querySelectorAll("button").forEach(function (b) {
          b.addEventListener("click", function () {
            applyLang(b.getAttribute("data-lang"), true);
            setMenu(false);
          });
        });
        document.addEventListener("click", function (e) {
          if (!sw.contains(e.target) && !menu.contains(e.target)) { setMenu(false); }
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") { setMenu(false); }
        });
      }

      /* pull-to-refresh: pull down from the top on touch devices to reload */
      var isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
      var ptrEl = document.getElementById("ptr");
      if (isTouch && ptrEl) {
        var PTR_THRESHOLD = 80;
        var PTR_PULL_MAX = 98;
        var startY = 0, pulling = false, dist = 0, holdTimer = null;
        var paths = Array.prototype.slice.call(ptrEl.querySelectorAll(".glyph path"));
        paths.forEach(function (p) {
          var L = p.getTotalLength();
          p._L = L;
          p.style.strokeDasharray = L;
          p.style.strokeDashoffset = L;
        });
        function hideAll() {
          paths.forEach(function (p) { p.style.strokeDashoffset = p._L; });
        }
        function resetPtr() {
          clearTimeout(holdTimer);
          pulling = false;
          dist = 0;
          document.body.classList.remove("ptr-active", "ptr-loading", "ptr-hold", "ptr-dragging");
          document.body.style.setProperty("--ptr", "0px");
          hideAll();
        }
        function scheduleHold() {
          clearTimeout(holdTimer);
          holdTimer = setTimeout(function () {
            if (!pulling) return;
            document.body.classList.add("ptr-hold");
          }, 300);
        }
        document.addEventListener("touchstart", function (e) {
          if (window.scrollY > 0 || document.body.classList.contains("ptr-loading")) return;
          startY = e.touches[0].clientY;
          pulling = true;
          dist = 0;
          hideAll();
        }, { passive: true });
        document.addEventListener("touchmove", function (e) {
          if (!pulling) return;
          var d = e.touches[0].clientY - startY;
          if (d <= 0) { resetPtr(); return; }
          dist = d;
          var r = Math.min(d * 0.5, PTR_PULL_MAX);
          document.body.classList.add("ptr-dragging", "ptr-active");
          document.body.classList.remove("ptr-hold");
          document.body.style.setProperty("--ptr", r + "px");
          var p = Math.min(d / PTR_THRESHOLD, 1);
          paths.forEach(function (path) {
            path.style.strokeDashoffset = (path._L * (1 - p)).toFixed(1);
          });
          scheduleHold();
        }, { passive: true });
        document.addEventListener("touchend", function () {
          if (!pulling) return;
          clearTimeout(holdTimer);
          document.body.classList.remove("ptr-dragging", "ptr-hold");
          if (dist >= PTR_THRESHOLD) {
            pulling = false;
            document.body.classList.add("ptr-loading");
            document.body.style.setProperty("--ptr", "60px");
            setTimeout(function () { location.reload(); }, 400);
          } else {
            resetPtr();
          }
        });
        document.addEventListener("touchcancel", resetPtr);
      }
    })();
  </script>
</body>

</html>

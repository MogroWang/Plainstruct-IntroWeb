<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>来认识一下『素构 Plainstruct』。</title>
  <meta name="description" content="素构 Plainstruct 是一个本地运行的静态文档网站创建器。在文件夹里写 Markdown，一键构建、本地预览、发布到 GitHub Pages——不需要命令行，不需要后端。">
  <meta name="theme-color" content="#f7f7f7">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    /* one material decision: a neutral gray-white field with a single ink
   accent - the brand's own rule. type is each platform's native system
   sans; hierarchy comes from size, weight and whitespace only. no
   gradients, no glow, 8px radii, 4px grid, one easing curve. */
    :root {
      --ink: #1d1d1d;
      --muted: #555555;
      --faint: #8c8c8c;
      --rule: #e6e6e6;
      --paper: #f7f7f7;
      --white: #ffffff;
      --measure: 76ch;
      --fig: 840px;
      --sans: "Segoe UI Variable", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "PingFang SC", "Microsoft YaHei", monospace;
      --ease: cubic-bezier(.23, 1, .32, 1);
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: none
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 18px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-optical-sizing: auto;
      touch-action: manipulation;
      cursor: default;
      caret-color: transparent
    }

    /* keep text selectable, but drop the I-beam text cursor */
    a,
    button,
    input,
    select,
    textarea,
    [role="button"] {
      cursor: pointer
    }

    a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--ink) 32%, transparent);
      transition: color 200ms var(--ease), border-color 200ms var(--ease)
    }

    a:hover {
      color: #000;
      border-bottom-color: #000
    }

    a:active {
      color: #000
    }

    img {
      max-width: 100%;
      display: block
    }

    p {
      margin: 0;
      white-space: pre-wrap
    }

    /* top bar: logo + a few icons. no link list. a gradient blur layer
   (::before) replaces the opaque strip - content scrolling under the bar
   dissolves into blur instead of hitting a hard divider. after a 5% dead
   zone the bar shrinks into a floating glass card with 8px corners. */
    .bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: transparent
    }

    .bar::before {
      content: '';
      position: absolute;
      top: -50px;
      left: 0;
      right: 0;
      bottom: -100px;
      background: color-mix(in srgb, var(--paper) 85%, transparent);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(15px) saturate(200%);
      -webkit-mask-image: linear-gradient(to bottom, black 0%, rgba(0, 0, 0) 45%, rgba(0, 0, 0, .30) 85%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 0%, rgba(0, 0, 0) 45%, rgba(0, 0, 0, .30) 85%, transparent 100%);
      z-index: -1;
      pointer-events: none;
      transition: background .35s var(--ease)
    }

    .bar-in {
      position: relative;
      z-index: 1;
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 28px;
      height: 60px;
      border: 1px solid transparent;
      box-shadow: 0 0 0 0 transparent;
      transform: translateY(0);
      display: flex;
      align-items: center;
      gap: 20px;
      contain: layout;
      will-change: transform, max-width, height;
      transition: max-width .35s var(--ease), height .35s var(--ease), padding .35s var(--ease), border-radius .35s var(--ease), border-color .35s var(--ease), background .35s var(--ease), box-shadow .35s var(--ease), transform .35s var(--ease)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--ink);
      border-bottom: 0;
      transition: color 200ms var(--ease), opacity 200ms var(--ease)
    }

    .brand:active {
      opacity: .7
    }

    .brand img {
      height: 28px;
      width: auto;
      transition: height .35s var(--ease), transform .3s var(--ease)
    }

    .brand:hover img {
      transform: scale(1.04)
    }

    .bar-r {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 16px
    }

    .lang {
      position: relative;
      display: flex
    }

    .lang>button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 0;
      background: none;
      padding: 0;
      color: var(--faint);
      cursor: pointer;
      font-family: inherit;
      border-radius: 8px;
      transition: color 200ms var(--ease), background-color 200ms var(--ease), transform 100ms var(--ease)
    }

    .lang>button svg {
      width: 18px;
      height: 18px;
      display: block
    }

    .lang>button:hover {
      color: var(--ink);
      background: color-mix(in srgb, var(--ink) 6%, transparent)
    }

    .lang>button:active {
      transform: scale(.92);
      background: color-mix(in srgb, var(--ink) 8%, transparent)
    }

    /* dropdown menu: a translucent card that materializes from the trigger,
   scaling out of its top-right origin and fading in together. */
    .lang-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 160px;
      padding: 6px;
      box-sizing: border-box;
      background: color-mix(in srgb, var(--white) 86%, transparent);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid var(--rule);
      border-radius: 8px;
      box-shadow: 0 16px 36px rgb(0 0 0 / 14%);
      transform-origin: top right;
      visibility: hidden;
      opacity: 0;
      transform: scale(.92) translateY(-4px);
      transition: opacity .18s var(--ease), transform .25s var(--ease), visibility 0s linear .25s;
      z-index: 60
    }

    .lang-menu.open {
      visibility: visible;
      opacity: 1;
      transform: scale(1) translateY(0);
      transition: opacity .18s var(--ease), transform .25s var(--ease), visibility 0s
    }

    .lang-menu button {
      display: flex;
      width: 100%;
      height: auto;
      padding: 8px 12px;
      border: 0;
      background: none;
      font-size: 14px;
      color: var(--ink);
      cursor: pointer;
      font-family: inherit;
      border-radius: 4px;
      transition: background-color 200ms var(--ease)
    }

    .lang-menu button.on {
      font-weight: 700;
      color: var(--ink)
    }

    .lang-menu button:hover {
      background: color-mix(in srgb, var(--ink) 6%, transparent)
    }

    .lang-menu button:active {
      background: color-mix(in srgb, var(--ink) 10%, transparent)
    }

    .icon-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 0;
      background: none;
      padding: 0;
      color: var(--faint);
      cursor: pointer;
      font-family: inherit;
      border-radius: 8px;
      transition: color 200ms var(--ease), background-color 200ms var(--ease), transform 100ms var(--ease)
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      display: block
    }

    .icon-btn:hover {
      color: var(--ink);
      background: color-mix(in srgb, var(--ink) 6%, transparent)
    }

    .icon-btn:active {
      transform: scale(.92);
      background: color-mix(in srgb, var(--ink) 8%, transparent)
    }

    /* tooltip: a small ink pill that fades in below the trigger on hover/focus */
    .icon-btn .tip,
    .lang>button .tip {
      position: absolute;
      top: calc(100% + 8px);
      right: 50%;
      transform: translate(50%, 4px);
      white-space: nowrap;
      padding: 5px 10px;
      font-size: 12.5px;
      font-weight: 500;
      color: #fff;
      background: color-mix(in srgb, var(--ink) 90%, transparent);
      box-shadow: 0 6px 16px rgb(0 0 0 / 22%);
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s var(--ease), transform .15s var(--ease);
      z-index: 70
    }

    .icon-btn:hover .tip,
    .icon-btn:focus-visible .tip,
    .lang>button:hover .tip,
    .lang>button:focus-visible .tip {
      opacity: 1;
      transform: translate(50%, 0)
    }

    /* hide the tooltip while the language menu is open */
    .lang:has(.lang-menu.open) .tip {
      opacity: 0
    }

    /* scrolled: shrink into a centered floating card */
    .bar.scrolled {
      background: transparent
    }

    .bar.scrolled::before {
      background: color-mix(in srgb, var(--paper) 50%, transparent)
    }

    .bar.scrolled .bar-in {
      max-width: min(520px, calc(100% - 28px));
      height: 48px;
      padding: 0 20px;
      border-radius: 8px;
      border-color: var(--rule);
      background: color-mix(in srgb, var(--white) 80%, transparent);
      box-shadow: 0 14px 30px rgb(0 0 0 / 12%);
      transform: translateY(10px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      backdrop-filter: saturate(180%) blur(16px)
    }

    .bar.scrolled .brand img {
      height: 25px
    }

    @media (prefers-reduced-motion:reduce) {

      .bar,
      .bar-in,
      .brand img,
      .bar::before {
        transition: none
      }

      .lang-menu {
        transform: none;
        transition: opacity 150ms ease
      }
    }

    @media (prefers-reduced-transparency:reduce) {
      .bar::before {
        background: var(--paper);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        -webkit-mask-image: none;
        mask-image: none
      }

      .bar.scrolled .bar-in {
        background: var(--white);
        -webkit-backdrop-filter: none;
        backdrop-filter: none
      }

      .lang-menu {
        background: var(--white);
        -webkit-backdrop-filter: none;
        backdrop-filter: none
      }
    }

    @media (prefers-contrast:more) {
      .bar::before {
        background: var(--white);
        -webkit-mask-image: none;
        mask-image: none
      }

      .bar.scrolled .bar-in {
        background: var(--white);
        border-color: var(--ink)
      }

      a {
        border-bottom-color: var(--ink)
      }

      .dl a {
        border-bottom-color: var(--ink)
      }
    }

    /* layout: a single centered column. figures break out a little wider. */
    main {
      max-width: var(--measure);
      margin: 0 auto;
      padding: 144px 40px 40px;
      transition: opacity .2s var(--ease), transform .2s var(--ease)
    }

    main.switching {
      opacity: 0;
      transform: translateY(8px)
    }

    .figure {
      max-width: var(--fig);
      margin: 56px auto
    }

    figure {
      margin: 0
    }

    figure img {
      width: 100%;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: var(--white);
      box-shadow: 0 16px 32px rgb(0 0 0 / 10%)
    }

    figcaption {
      margin-top: 20px;
      font-size: 13.5px;
      color: var(--faint);
      line-height: 1.5;
      text-align: center;
      letter-spacing: .005em
    }

    /* type scale with real contrast; no kickers, no all-caps. */
    h1 {
      font-weight: 800;
      letter-spacing: -.025em;
      line-height: 1.12;
      font-size: clamp(58px, 7.8vw, 76px);
      margin: 0 0 24px;
      text-wrap: balance;
      text-align: center
    }

    .lead {
      font-size: 21px;
      color: var(--muted);
      line-height: 1.7;
      text-align: center;
      white-space: pre-wrap
    }

    /* Chinese optically corrects for the trailing full-width period: the
   centered line reads shifted left by half a full-width box, so nudge it
   right by one half-width (0.5em). english needs no correction. */
    body.lang-zh h1,
    body.lang-zh .lead,
    body.lang-zh figcaption {
      padding-left: .5em
    }

    /* primary action pair: a filled Download and a plain GitHub link.
   instant press feedback, 8px corners, restrained shadow lift. */
    .cta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin: 32px 0 0
    }

    .cta a {
      display: inline-flex;
      align-items: center
    }

    /* balance the pair: give the text link equal optical weight to the button */
    .cta a:not(.btn) {
      font-size: 16px;
      font-weight: 600;
      padding: 0 4px;
      line-height: 1;
      border-bottom: 0;
      gap: 6px
    }

    .cta a:not(.btn) svg {
      width: 15px;
      height: 15px;
      flex: none
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 48px;
      padding: 0 28px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      transition: transform .1s var(--ease), background-color .2s var(--ease), box-shadow .2s var(--ease), color .2s var(--ease)
    }

    .btn:active {
      transform: scale(.97)
    }

    .btn:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px
    }

    .btn-primary {
      background: var(--ink);
      color: #fff;
      box-shadow: 0 8px 20px rgb(0 0 0 / 20%)
    }

    .btn-primary:hover {
      background: #000;
      color: #fff;
      border-color: transparent;
      box-shadow: 0 12px 24px rgb(0 0 0 / 24%)
    }

    h2 {
      font-weight: 700;
      letter-spacing: -.012em;
      line-height: 1.25;
      font-size: clamp(24px, 3vw, 32px);
      margin: 88px 0 16px;
      text-wrap: balance
    }

    h2:first-of-type {
      margin-top: 88px
    }

    p+p {
      margin-top: 20px
    }

    .prose p {
      color: var(--ink)
    }

    .prose p+p {
      color: var(--muted)
    }

    .prose code {
      font-family: var(--mono);
      font-size: .86em;
      padding: 1px 6px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--ink) 6%, transparent)
    }

    /* a real list where a list is the right shape; no card grid. */
    ul.items {
      list-style: none;
      margin: 20px 0 0;
      padding: 0
    }

    ul.items li {
      padding: 16px 0;
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 8px 24px;
      align-items: baseline
    }

    ul.items li:last-child {
      border-bottom: 1px solid var(--rule)
    }

    ul.items b {
      font-weight: 650;
      font-size: 16px
    }

    ul.items span {
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.55;
      letter-spacing: .003em
    }

    /* downloads: a plain list of links, not equal cards. */
    .dl {
      margin: 20px 0 0;
      border-top: 1px solid var(--rule)
    }

    .dl a {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 17px 0;
      border-bottom: 1px solid var(--rule);
      color: var(--ink);
      font-weight: 600;
      font-size: 16px;
      transition: color 200ms var(--ease), background-color 200ms var(--ease), transform 100ms var(--ease)
    }

    .dl a:hover {
      color: #000
    }

    .dl a:active {
      transform: scale(.985);
      background-color: color-mix(in srgb, var(--ink) 4%, transparent)
    }

    .dl a .v {
      margin-left: auto;
      color: var(--faint);
      font-weight: 400;
      font-size: 13.5px;
      letter-spacing: .005em
    }

    /* footer: one line, two halves. */
    footer {
      max-width: 1040px;
      margin: 120px auto 0;
      padding: 32px 40px 48px;
      border-top: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 13.5px;
      color: var(--faint)
    }

    footer a {
      color: var(--muted);
      font-weight: 500
    }

    footer .links {
      display: flex;
      gap: 18px
    }

    /* studio sign-off: the wordmark sits centered under the footer row.
   hovering softly defocuses it while a line of ink text fades in over
   its center, naming the destination. */
    footer .studio-mark {
      position: relative;
      flex: 1 1 100%;
      display: flex;
      justify-content: center;
      margin-top: 32px;
      border-bottom: 0;
      color: inherit
    }

    footer .studio-mark .mark-hint {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + 5px));
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .01em;
      line-height: 1;
      color: var(--ink);
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s var(--ease), transform .35s var(--ease)
    }

    footer .studio-mark:hover .mark-hint,
    footer .studio-mark:focus-visible .mark-hint {
      opacity: 1;
      transform: translate(-50%, -50%)
    }

    footer .studio-mark img {
      display: block;
      height: 20px;
      width: auto;
      filter: brightness(0);
      transition: filter .55s var(--ease), opacity .55s var(--ease), transform .55s var(--ease)
    }

    footer .studio-mark:hover img,
    footer .studio-mark:focus-visible img {
      filter: brightness(0) blur(5px);
      opacity: .55;
      transform: scale(1.03)
    }

    footer .studio-mark:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 6px;
      border-radius: 4px
    }

    @media (prefers-reduced-motion:reduce) {
      footer .studio-mark img {
        transition: none
      }
    }

    /* one subtle reveal: opacity + small translate, standard ease. */
    [data-reveal] {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .6s var(--ease), transform .6s var(--ease);
      transition-delay: calc(var(--i, 0)*80ms);
      will-change: transform, opacity
    }

    [data-reveal].in {
      opacity: 1;
      transform: none;
      will-change: auto
    }

    /* pull-to-refresh: a progress ring that fills as you pull. once the user
   holds still past the threshold it morphs into a pill prompting release.
   touch-only. */
    .ptr {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--ptr, 0px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 200;
      pointer-events: none;
      transition: height .3s cubic-bezier(.23, 1, .32, 1)
    }

    body.ptr-dragging .ptr {
      transition-duration: 0s
    }

    .ptr-inner {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      margin-bottom: 14px;
      overflow: hidden;
      border-radius: 8px;
      background: color-mix(in srgb, var(--white) 88%, transparent);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 26px rgb(0 0 0 / 16%);
      opacity: 0;
      transform: translateY(10px) scale(.9);
      transition: opacity .25s var(--ease), transform .25s var(--ease), width .32s var(--ease)
    }

    body.ptr-active .ptr-inner {
      opacity: 1;
      transform: translateY(0) scale(1)
    }

    body.ptr-hold .ptr-inner {
      width: 140px
    }

    .ptr-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
      transition: opacity .2s var(--ease)
    }

    body.ptr-hold .ptr-ring {
      opacity: 0
    }

    .ptr-ring .track {
      fill: none;
      stroke: color-mix(in srgb, var(--ink) 20%, transparent);
      stroke-width: 2.5
    }

    .ptr-ring .block,
    .ptr-ring .base {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .ptr-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      opacity: 0;
      transition: opacity .2s var(--ease)
    }

    body.ptr-hold .ptr-label {
      opacity: 1
    }

    @media (prefers-reduced-motion:reduce) {
      [data-reveal] {
        opacity: 1;
        transform: none;
        transition: none
      }

      main {
        transition: opacity .15s ease
      }

      main.switching {
        transform: none
      }

      .ptr {
        transition: none
      }

      .ptr-inner {
        transition: opacity .15s ease
      }

      .ptr-ring,
      .ptr-label {
        transition: opacity .15s ease
      }

      html {
        scroll-behavior: auto
      }
    }

    @media (max-width:680px) {
      main {
        padding: 104px 22px 24px
      }

      h1 {
        margin: 28px 0 24px
      }

      .figure {
        margin: 40px 0
      }

      ul.items li {
        grid-template-columns: 1fr
      }

      .bar-in {
        max-width: 100%
      }

      .bar.scrolled .bar-in {
        max-width: calc(100% - 28px)
      }
    }

    /* ambient background: a quiet loop of gray ripples, a self-drawing
   document (three writing lines) and a self-drawing structure (the
   logo's stacked blocks), all behind the content and barely there.
   pure CSS, pointer-events off, hidden under prefers-reduced-motion. */
    .bg-fx {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none
    }

    .bg-fx i,
    .bg-fx svg {
      position: absolute;
      display: block
    }

    .fx-spot {
      width: 480px;
      height: 480px
    }

    .fx-spot.fx-a {
      left: 7vw;
      top: 30vh;
      animation: fx-drift-a 58s ease-in-out infinite
    }

    .fx-spot.fx-b {
      left: 93vw;
      top: 68vh;
      animation: fx-drift-b 47s ease-in-out infinite;
      animation-delay: -19s
    }

    /* each layer wanders along its own closed loop; the coprime periods
       keep the combination from ever settling into a visible pattern */
    @keyframes fx-drift-a {
      0% {
        transform: translate(calc(-50% - 1.6vw), calc(-50% + 1.2vh))
      }

      25% {
        transform: translate(calc(-50% + 1.8vw), calc(-50% + 2.6vh))
      }

      50% {
        transform: translate(calc(-50% + 2.6vw), calc(-50% - 1.8vh))
      }

      75% {
        transform: translate(calc(-50% - 2.2vw), calc(-50% - 2.4vh))
      }

      100% {
        transform: translate(calc(-50% - 1.6vw), calc(-50% + 1.2vh))
      }
    }

    @keyframes fx-drift-b {
      0% {
        transform: translate(calc(-50% + 1.4vw), calc(-50% - 2.2vh))
      }

      30% {
        transform: translate(calc(-50% - 2.4vw), calc(-50% - .8vh))
      }

      60% {
        transform: translate(calc(-50% - 1vw), calc(-50% + 2.8vh))
      }

      85% {
        transform: translate(calc(-50% + 2.2vw), calc(-50% + 1vh))
      }

      100% {
        transform: translate(calc(-50% + 1.4vw), calc(-50% - 2.2vh))
      }
    }

    .fx-spot i {
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid color-mix(in srgb, var(--ink) 30%, transparent);
      opacity: 0;
      animation: fx-ripple 10s cubic-bezier(.23, 1, .32, 1) infinite
    }

    .fx-spot i:nth-child(2) {
      animation-delay: -3.33s
    }

    .fx-spot i:nth-child(3) {
      animation-delay: -6.66s
    }

    @keyframes fx-ripple {
      0% {
        transform: scale(.22);
        opacity: 0
      }

      12% {
        opacity: .3
      }

      100% {
        transform: scale(1);
        opacity: 0
      }
    }

    /* 素: three writing lines drawing themselves, then fading */
    .fx-md {
      right: 7vw;
      top: 19vh;
      width: 150px;
      height: 100px;
      opacity: .18;
      animation: fx-drift-md 51s ease-in-out infinite;
      animation-delay: -13s
    }

    @keyframes fx-drift-md {
      0% {
        transform: translate(0, 0) rotate(-4deg)
      }

      35% {
        transform: translate(-2.2vw, 1.8vh) rotate(-7deg)
      }

      65% {
        transform: translate(-1vw, 3vh) rotate(-2deg)
      }

      85% {
        transform: translate(-2.8vw, -1.6vh) rotate(-5deg)
      }

      100% {
        transform: translate(0, 0) rotate(-4deg)
      }
    }

    .fx-md path {
      stroke: color-mix(in srgb, var(--ink) 60%, transparent);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: fx-write 11s cubic-bezier(.3, .1, .3, .95) infinite
    }

    .fx-md path:nth-child(2) {
      animation-delay: 1s
    }

    .fx-md path:nth-child(3) {
      animation-delay: 2s
    }

    @keyframes fx-write {
      0% {
        stroke-dashoffset: 1;
        opacity: 0
      }

      3% {
        opacity: 1
      }

      14% {
        stroke-dashoffset: 0
      }

      74% {
        stroke-dashoffset: 0;
        opacity: 1
      }

      82% {
        opacity: 0
      }

      100% {
        stroke-dashoffset: 1;
        opacity: 0
      }
    }

    /* 构: the logo's stacked blocks drawing themselves, then fading */
    .fx-blocks {
      left: 8vw;
      top: 66vh;
      width: 110px;
      height: 90px;
      opacity: .2;
      animation: fx-drift-blocks 38s ease-in-out infinite;
      animation-delay: -7s
    }

    @keyframes fx-drift-blocks {
      0% {
        transform: translate(0, 0) rotate(0deg)
      }

      30% {
        transform: translate(1.6vw, -2.2vh) rotate(3deg)
      }

      55% {
        transform: translate(2.6vw, 1.4vh) rotate(5deg)
      }

      80% {
        transform: translate(-1vw, 2.4vh) rotate(1deg)
      }

      100% {
        transform: translate(0, 0) rotate(0deg)
      }
    }

    .fx-blocks path {
      stroke: color-mix(in srgb, var(--ink) 60%, transparent);
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: fx-raise 12s cubic-bezier(.45, .05, .35, .95) infinite
    }

    .fx-blocks path:nth-child(2) {
      animation-delay: .6s
    }

    .fx-blocks path:nth-child(3) {
      animation-delay: 1.2s
    }

    .fx-blocks path:nth-child(4) {
      animation-delay: 1.8s
    }

    @keyframes fx-raise {
      0% {
        stroke-dashoffset: 1;
        opacity: 0
      }

      5% {
        opacity: 1
      }

      16% {
        stroke-dashoffset: 0
      }

      36% {
        stroke-dashoffset: 0;
        opacity: 1
      }

      48% {
        stroke-dashoffset: 1;
        opacity: 1
      }

      54%,
      100% {
        stroke-dashoffset: 1;
        opacity: 0
      }
    }

    @media (max-width:900px) {

      .fx-md,
      .fx-blocks {
        display: none
      }

      .fx-spot {
        width: 320px;
        height: 320px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .bg-fx {
        display: none
      }
    }

    /* ---------- 交互式工作区演示(以素构真实界面为蓝本,1440×900 设计稿等比缩放) ---------- */
    :root {
      --am-bg: #fafaf9;
      --am-surface: #ffffff;
      --am-surface-2: #f5f5f4;
      --am-surface-3: #efedec;
      --am-chip: #f1f0ef;
      --am-line: #e7e5e4;
      --am-line-strong: #d6d3d1;
      --am-ink: #1c1917;
      --am-ink-2: #57534e;
      --am-ink-3: #a8a29e;
      --am-accent: #333333;
      --am-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "PingFang SC", "Microsoft YaHei", monospace
    }

    .app-viewport {
      margin-top: 4px
    }

    .app-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1440 / 900;
      overflow: hidden;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: var(--white);
      box-shadow: 0 16px 32px rgb(0 0 0 / 10%)
    }

    .app-mock {
      position: absolute;
      top: 0;
      left: 0;
      width: 1440px;
      height: 900px;
      display: flex;
      flex-direction: column;
      transform: scale(var(--am-scale, .58));
      transform-origin: 0 0;
      background: var(--am-bg);
      font-family: var(--sans);
      text-align: left;
      user-select: none;
      -webkit-user-select: none
    }

    .app-mock button {
      display: flex;
      align-items: center;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font-family: inherit;
      cursor: pointer
    }

    .app-mock button:focus-visible {
      outline: 2px solid var(--am-ink);
      outline-offset: 2px;
      border-radius: 6px
    }

    .app-mock svg {
      display: block;
      flex: none
    }

    .app-mock img {
      width: auto;
      height: auto;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none
    }

    .app-mock .am-tb-logo {
      width: 20px;
      height: 20px
    }

    .app-mock a {
      border-bottom: 0
    }

    .app-mock [role="button"]:focus-visible {
      outline: 2px solid var(--am-ink);
      outline-offset: 2px;
      border-radius: 6px
    }

    .am-titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 12px;
      flex: none;
      background: var(--am-surface);
      border-bottom: 1px solid var(--am-line)
    }

    .am-tb-logo {
      width: 20px;
      height: 20px
    }

    .am-tb-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -.01em;
      color: var(--am-ink)
    }

    .am-tb-sep,
    .am-tb-site {
      font-size: 13px;
      color: var(--am-ink-3)
    }

    .am-tb-site {
      color: var(--am-ink-2)
    }

    .am-body {
      display: flex;
      flex: 1;
      min-height: 0
    }

    /* 文件树只属于「内容」页,与真实应用的视图结构一致 */
    .app-mock:not([data-view="editor"]) .am-tree {
      display: none
    }

    /* 活动栏 */
    .am-act {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 52px;
      padding: 8px 0;
      flex: none;
      background: var(--am-surface);
      border-right: 1px solid var(--am-line)
    }

    .am-act-btn {
      position: relative;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      color: var(--am-ink-3);
      transition: background-color 160ms var(--ease), color 160ms var(--ease), transform 120ms ease-out
    }

    .am-act-btn:hover {
      background: var(--am-surface-2);
      color: var(--am-ink-2)
    }

    .am-act-btn:active {
      transform: scale(.94)
    }

    .am-act-btn.on {
      background: var(--am-surface-2);
      color: var(--am-ink)
    }

    .am-act-btn.on::before {
      content: "";
      position: absolute;
      left: -6px;
      width: 2px;
      height: 16px;
      border-radius: 1px;
      background: var(--am-accent)
    }

    .am-act-gap {
      flex: 1
    }

    /* 文件树 */
    .am-tree {
      display: flex;
      flex-direction: column;
      width: 240px;
      min-height: 0;
      flex: none;
      background: var(--am-surface);
      border-right: 1px solid var(--am-line)
    }

    .am-tree-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 12px 4px
    }

    .am-tree-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
      color: var(--am-ink-3)
    }

    .am-tree-tools {
      display: flex;
      gap: 2px
    }

    .am-ib {
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      color: var(--am-ink-2);
      transition: background-color 160ms var(--ease), color 160ms var(--ease), transform 120ms ease-out
    }

    .am-ib:hover {
      background: var(--am-surface-2);
      color: var(--am-ink)
    }

    .am-ib:active {
      transform: scale(.92)
    }

    .am-tree-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 8px 16px
    }

    .am-row {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 30px;
      padding-left: 4px;
      padding-right: 4px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--am-ink);
      cursor: pointer;
      transition: background-color 160ms var(--ease)
    }

    .am-row:hover {
      background: var(--am-surface-2)
    }

    .am-row.on {
      background: var(--am-surface-3)
    }

    .am-row.on .am-label {
      font-weight: 500
    }

    .am-depth1 {
      padding-left: 18px
    }

    .am-w5 {
      width: 20px;
      flex: none
    }

    .am-ic {
      display: flex;
      color: var(--am-ink-3)
    }

    .am-ic-dir {
      color: var(--am-ink-2)
    }

    .am-label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .am-caret {
      justify-content: center;
      width: 20px;
      height: 20px;
      flex: none;
      border-radius: 5px;
      color: var(--am-ink-3);
      transition: background-color 120ms var(--ease)
    }

    .am-caret:hover {
      background: var(--am-chip);
      color: var(--am-ink)
    }

    .am-caret svg {
      transition: transform 300ms cubic-bezier(.34, 1.45, .64, 1)
    }

    .am-dir.closed .am-caret svg {
      transform: rotate(-90deg)
    }

    .am-sub {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 320ms cubic-bezier(.3, 1.06, .4, 1)
    }

    .am-sub.closed {
      grid-template-rows: 0fr
    }

    .am-sub-in {
      overflow: hidden;
      min-height: 0
    }

    /* 主区 */
    .am-main {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      background: var(--am-bg)
    }

    .am-dochead {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 44px;
      padding: 0 16px;
      flex: none;
      background: var(--am-surface);
      border-bottom: 1px solid var(--am-line)
    }

    .am-doc-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13.5px;
      font-weight: 600
    }

    .am-saved {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--am-ink-3)
    }

    .am-modes {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--am-line);
      border-radius: 6px;
      background: var(--am-bg)
    }

    .am-mode {
      justify-content: center;
      width: 28px;
      height: 24px;
      border-radius: 5px;
      color: var(--am-ink-3);
      transition: background-color 160ms var(--ease), color 160ms var(--ease), box-shadow 160ms var(--ease)
    }

    .am-mode:hover {
      color: var(--am-ink)
    }

    .am-mode.on {
      background: var(--am-surface);
      color: var(--am-ink);
      box-shadow: 0 0 0 1px var(--am-line)
    }

    .am-split {
      display: flex;
      flex: 1;
      min-height: 0
    }

    .am-editor {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 0 0 52%;
      background: var(--am-surface)
    }

    .am-split[data-mode="edit"] .am-preview,
    .am-split[data-mode="edit"] .am-divider,
    .am-split[data-mode="preview"] .am-editor,
    .am-split[data-mode="preview"] .am-divider {
      display: none
    }

    .am-split[data-mode="edit"] .am-editor {
      flex: 1 1 auto
    }

    .am-divider {
      position: relative;
      width: 1px;
      flex: none;
      background: var(--am-line);
      cursor: col-resize
    }

    .am-divider::before {
      content: "";
      position: absolute;
      inset: 0 -3px
    }

    .am-divider:hover,
    .am-divider.drag {
      background: var(--am-line-strong)
    }

    .am-toolbar {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 36px;
      padding: 0 8px;
      flex: none;
      border-bottom: 1px solid var(--am-line);
      overflow: hidden
    }

    .am-tb {
      justify-content: center;
      min-width: 26px;
      height: 26px;
      padding: 0 4px;
      border-radius: 5px;
      color: var(--am-ink-3);
      font-size: 12px;
      font-weight: 600;
      font-family: var(--sans);
      transition: background-color 160ms var(--ease), color 160ms var(--ease)
    }

    .am-tb:hover {
      background: var(--am-surface-2);
      color: var(--am-ink)
    }

    .am-tb.b {
      font-weight: 700
    }

    .am-tb.i {
      font-style: italic
    }

    .am-tb.s {
      text-decoration: line-through
    }

    .am-tsep {
      width: 1px;
      height: 14px;
      margin: 0 4px;
      flex: none;
      background: var(--am-line)
    }

    .am-codescroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto
    }

    .am-code {
      margin: 0;
      padding: 12px 16px 32px 14px;
      font-family: var(--am-mono);
      font-size: 13.5px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--am-ink)
    }

    .am-meta {
      color: var(--am-ink-3)
    }

    .am-h {
      font-weight: 600;
      color: var(--am-ink)
    }

    .am-h1 {
      font-size: 1.18em;
      font-weight: 700
    }

    .am-h2 {
      font-size: 1.1em;
      font-weight: 650
    }

    .am-strong {
      font-weight: 650
    }

    .am-em {
      font-style: italic
    }

    .am-strike {
      text-decoration: line-through;
      color: var(--am-ink-3)
    }

    .am-link {
      color: var(--am-accent);
      text-decoration: underline
    }

    .am-codec {
      font-family: var(--am-mono);
      color: var(--am-ink-2)
    }

    .am-kw {
      font-weight: 600
    }

    .am-str {
      color: #0f766e
    }

    .am-type {
      color: #1d4ed8
    }

    /* 预览(.wide = 设计稿宽度 ≥900px 时的桌面布局,由 JS 按设计稿宽度切换,与真实 iframe 断点一致) */
    .am-preview {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      background: var(--am-bg)
    }

    .am-topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 54px;
      padding: 0 12px;
      flex: none;
      background: var(--am-surface);
      border-bottom: 1px solid var(--am-line)
    }

    .am-menu {
      justify-content: center;
      width: 38px;
      height: 38px;
      flex: none;
      border: 1px solid var(--am-line);
      border-radius: 10px;

    }

    .am-menu:hover {

    }

    }

      line-height: 1.6;
      color: var(--am-ink-2)

      margin-top: 20px

    .am-pscroll {
      flex: 1;
      min-width: 0;
      overflow-y: auto
    }

    .am-psdoc {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px 0
    }

    .am-preview.wide .am-psdoc {
      padding: 56px 32px 0
    }

    .am-psfoot {
      padding: 28px 20px 32px
    }

    .am-preview.wide .am-psfoot {
      padding: 28px 32px 40px
    }

    .am-pt {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.25;
      text-align: left
    }

    .am-pb {
      font-size: 15.5px;
      line-height: 1.8;
      color: var(--am-ink);
      text-align: left
    }

    .am-pb h1,
    .am-pb h2,
    .am-pb h3 {
      margin: 1.6em 0 .6em;
      letter-spacing: -.01em;
      line-height: 1.35;
      text-align: left
    }

    .am-pb>h1:first-child {
      margin-top: 0
    }

    .am-pb h1 {
      font-size: 26px;
      font-weight: 700
    }

    .am-pb h2 {
      padding-bottom: 8px;
      border-bottom: 1px solid var(--am-line);
      font-size: 21px;
      font-weight: 650
    }

    .am-pb h3 {
      font-size: 17px;
      font-weight: 650
    }

    .am-pb p {
      margin: 0 0 1em
    }

    .am-pb a {
      color: var(--am-accent);
      text-decoration: none;
      cursor: pointer
    }

    .am-pb a:hover {
      text-decoration: underline
    }

    .am-pb code {
      padding: .15em .4em;
      border-radius: 4px;
      background: var(--am-surface-2);
      font-family: var(--am-mono);
      font-size: .88em
    }

    .am-pb pre {
      margin: 0 0 1.2em;
      padding: 16px;
      border: 1px solid var(--am-line);
      border-radius: 8px;
      background: var(--am-surface);
      overflow-x: auto;
      line-height: 1.6
    }

    .am-pb pre code {
      padding: 0;
      background: transparent;
      font-size: 13px
    }

    .am-pb blockquote {
      margin: 0 0 1em;
      padding: 2px 0 2px 16px;
      border-left: 3px solid var(--am-line);
      color: var(--am-ink-2)
    }

    .am-pb ul,
    .am-pb ol {
      margin: 0 0 1em;
      padding-left: 1.6em
    }

    .am-pb li {
      margin: .25em 0
    }

    .am-pb li.task {
      list-style: none;
      margin-left: -1.4em
    }

    .am-pb li.task input {
      margin-right: 8px;
      vertical-align: -2px;
      pointer-events: none
    }

    .am-pb table {
      width: 100%;
      margin: 0 0 1.2em;
      border-collapse: collapse;
      font-size: 14px;
      line-height: 1.6
    }

    .am-pb th,
    .am-pb td {
      padding: 8px 12px;
      border: 1px solid var(--am-line);
      text-align: left
    }

    .am-pb th {
      background: var(--am-surface-2);
      font-weight: 600
    }

    .am-pb hr {
      margin: 2em 0;
      border: none;
      border-top: 1px solid var(--am-line)
    }

    .am-pager {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 72px
    }

    .am-pager:empty {
      display: none
    }

    .am-pgi {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 46%;
      padding: 10px 16px;
      border: 1px solid var(--am-line);
      border-radius: 10px;
      background: var(--am-surface);
      font-size: 13.5px;
      color: var(--am-ink-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: border-color 160ms var(--ease), background-color 160ms var(--ease), color 160ms var(--ease), transform 220ms var(--ease), box-shadow 220ms var(--ease)
    }

    .am-pgi:hover {
      border-color: var(--am-accent);
      background: var(--am-chip);
      color: var(--am-ink);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgb(28 25 23 / 8%)
    }

    .am-pgi:active {
      transform: translateY(0);
      box-shadow: none
    }

    .am-pgi.next {
      margin-left: auto
    }

    .am-pgi .tag {
      transition: transform 220ms var(--ease)
    }

    .am-pgi.prev:hover .tag {
      transform: translateX(-3px)
    }

    .am-pgi.next:hover .tag {
      transform: translateX(3px)
    }

    .am-psfoot {
      display: flex;
      justify-content: center;
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 32px;
      font-size: 12.5px
    }

    .am-psfoot a {
      display: inline-flex;
      padding: 5px 14px;
      border: 1px solid var(--am-line);
      border-radius: 999px;
      color: var(--am-ink-3);
      text-decoration: none;
      cursor: pointer;
      transition: color 160ms var(--ease), border-color 160ms var(--ease), background-color 160ms var(--ease)
    }

    .am-psfoot a:hover {
      color: var(--am-ink);
      border-color: var(--am-ink-3);
      background: var(--am-surface)
    }

    .am-fade {
      transition: opacity 150ms var(--ease)
    }

    .am-fade.out {
      opacity: 0
    }

    /* 放大的交互演示图:破栏居中,超出正文列宽但不超出视口 */
    .figure-wide {
      max-width: none;
      width: min(1040px, calc(100vw - 48px));
      margin-left: 50%;
      translate: -50% 0
    }

    /* 活动栏视图切换 */
    .am-view {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0
    }

    .am-view[hidden] {
      display: none
    }

    .am-view.in {
      animation: am-view-in 300ms var(--ease) both
    }

    @keyframes am-view-in {

      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    /* 通用控件(站点/构建/主题/发布页,与素构 base.css 同规格) */
    .am-panel {
      background: var(--am-surface);
      border: 1px solid var(--am-line);
      border-radius: 8px
    }

    .am-p24 {
      padding: 24px
    }

    .am-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto
    }

    .am-col {
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 32px
    }

    .am-vstack {
      display: flex;
      flex-direction: column;
      gap: 24px
    }

    .am-h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -.01em;
      color: var(--am-ink)
    }

    .am-h2t {
      margin: 0 0 16px;
      font-size: 15px;
      font-weight: 600;
      color: var(--am-ink)
    }

    .am-vsub {
      margin: 4px 0 0;
      font-size: 13px;
      line-height: 1.6;
      color: var(--am-ink-2)
    }

    .am-flabel {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--am-ink-2)
    }

    .am-fhint {
      margin: 6px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: var(--am-ink-3)
    }

    .am-fgap {
      display: flex;
      flex-direction: column;
      gap: 20px
    }

    .am-grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    .am-input {
      width: 100%;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--am-line);
      border-radius: 8px;
      background: var(--am-surface);
      color: var(--am-ink);
      font-family: inherit;
      font-size: 13px;
      cursor: default;
      transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease)
    }

    .am-input::placeholder {
      color: var(--am-ink-3)
    }

    .am-input:hover {
      border-color: var(--am-line-strong)
    }

    .am-input:focus {
      outline: none;
      border-color: var(--am-accent);
      box-shadow: 0 0 0 3px rgb(51 51 51 / 8%)
    }

    .am-input.mono {
      font-family: var(--am-mono);
      font-size: 12.5px
    }

    .am-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease), transform 120ms ease-out
    }

    .am-btn:active {
      transform: scale(.97)
    }

    .am-btn-primary {
      background: var(--am-accent);
      color: #fff
    }

    .am-btn-primary:hover {
      background: var(--am-ink)
    }

    .am-btn-secondary {
      background: var(--am-surface);
      border-color: var(--am-line);
      color: var(--am-ink)
    }

    .am-btn-secondary:hover {
      background: var(--am-surface-2)
    }

    .am-btn-ghost {
      background: transparent;
      color: var(--am-ink-2)
    }

    .am-btn-ghost:hover {
      background: var(--am-surface-2);
      color: var(--am-ink)
    }

    .am-btn[disabled] {
      opacity: .45;
      pointer-events: none
    }

    .am-btn-sm {
      height: 26px;
      padding: 0 8px;
      font-size: 12px
    }

    .am-check {
      width: 14px;
      height: 14px;
      margin: 0;
      flex: none;
      accent-color: var(--am-accent)
    }

    .am-check:disabled {
      opacity: 1
    }

    .am-checkrow {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--am-ink-2);
      cursor: default
    }

    .am-select {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 192px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--am-line);
      border-radius: 8px;
      background: var(--am-surface);
      font-size: 13px;
      color: var(--am-ink);
      transition: border-color 160ms var(--ease)
    }

    .am-select:hover {
      border-color: var(--am-line-strong)
    }

    .am-select .am-ic {
      color: var(--am-ink-3)
    }

    .am-swatch {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .am-swatch i {
      display: block;
      width: 32px;
      height: 32px;
      padding: 2px;
      border: 1px solid var(--am-line);
      border-radius: 8px
    }

    .am-swatch i b {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 5px;
      background: #333
    }

    .am-swatch span,
    .am-cfg-val {
      font-family: var(--am-mono);
      font-size: 12px;
      color: var(--am-ink-2)
    }

    .am-cfg-row {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .am-range {
      width: 192px;
      accent-color: var(--am-accent)
    }

    .am-range:disabled {
      opacity: 1
    }

    .am-mono {
      font-family: var(--am-mono)
    }

    .am-path {
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--am-surface-2);
      font-family: var(--am-mono);
      font-size: 12px;
      color: var(--am-ink-2);
      word-break: break-all
    }

    /* 视图头(构建/主题) */
    .am-vhead {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 56px;
      padding: 0 20px;
      flex: none;
      background: var(--am-surface);
      border-bottom: 1px solid var(--am-line)
    }

    .am-vhead .t {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--am-ink)
    }

    .am-vhead .s {
      font-size: 12px;
      color: var(--am-ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    /* 构建页 */
    .am-bbody {
      display: flex;
      flex: 1;
      min-height: 0
    }

    .am-baside {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 280px;
      padding: 20px;
      flex: none;
      background: var(--am-surface);
      border-right: 1px solid var(--am-line);
      overflow-y: auto
    }

    .am-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 20px
    }

    .am-stat {
      font-size: 13px;
      color: var(--am-ink-2)
    }

    .am-stat b {
      margin-right: 4px;
      font-size: 17px;
      font-weight: 700;
      color: var(--am-ink)
    }

    .am-bactions {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--am-line);
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .am-bactions .am-btn {
      width: 100%
    }

    .am-bmain {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0
    }

    .am-pvhead {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 16px;
      flex: none;
      background: var(--am-surface);
      border-bottom: 1px solid var(--am-line)
    }

    .am-pvhead .t {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--am-ink-2)
    }

    .am-pvhead .s {
      font-size: 11.5px;
      color: var(--am-ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .am-bpv {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      background: var(--am-bg)
    }

    /* 主题页 */
    .am-taside {
      width: 264px;
      padding: 12px;
      flex: none;
      background: var(--am-surface);
      border-right: 1px solid var(--am-line);
      overflow-y: auto
    }

    .am-tlist {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px
    }

    .am-theme-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      transition: background-color 160ms var(--ease), border-color 160ms var(--ease)
    }

    .am-theme-item:hover {
      background: var(--am-surface-2)
    }

    .am-theme-item.current {
      border-color: var(--am-line);
      background: var(--am-surface-2)
    }

    .am-theme-item .nm {
      font-size: 13px;
      font-weight: 500;
      color: var(--am-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .am-theme-item .v {
      margin: 0;
      font-family: var(--am-mono);
      font-size: 11px;
      color: var(--am-ink-3)
    }

    .am-badge {
      flex: none;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--am-accent);
      color: #fff;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .02em
    }

    .am-tact {
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0;
      transition: opacity 160ms var(--ease)
    }

    .am-theme-item:hover .am-tact {
      opacity: 1
    }

    .am-tlabel {
      font-size: 12px;
      font-weight: 500;
      color: var(--am-ink-2);
      margin: 0
    }

    .am-tempty {
      margin: 4px 0 0;
      border: 1px dashed var(--am-line);
      border-radius: 8px;
      padding: 16px 12px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--am-ink-3)
    }

    .am-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 40px;
      padding: 0 16px;
      flex: none;
      background: var(--am-surface);
      border-bottom: 1px solid var(--am-line)
    }

    .am-tab {
      height: 28px;
      padding: 0 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--am-ink-2);
      transition: background-color 160ms var(--ease), color 160ms var(--ease)
    }

    .am-tab:hover {
      background: var(--am-surface-2)
    }

    .am-tab.active {
      background: var(--am-surface-3);
      color: var(--am-ink)
    }

    .am-tab[disabled] {
      opacity: .4;
      pointer-events: none
    }

    .am-tconf {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 24px
    }

    .am-cfg {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 420px
    }

    .am-tpv {
      display: flex;
      flex-direction: column;
      width: 46%;
      min-width: 320px;
      flex: none;
      border-left: 1px solid var(--am-line)
    }

    @media (max-width:680px) {
      .app-viewport {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch
      }

      .app-stage {
        width: 680px
      }
    }

    @media (prefers-reduced-motion:reduce) {

      .am-sub,
      .am-caret svg,
      .am-fade,
      .am-pgi,
      .am-pgi .tag {
        transition: none
      }

      .am-view.in {
        animation: none
      }
    }
  </style>
</head>

        <a class="icon-btn" href="https://github.com/MogroWang/Plainstruct" target="_blank" rel="noopener"

  <script>
    (function () {
      "use strict";
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* shrink the top bar into a card after a 5% scroll dead zone */
      var bar = document.querySelector(".bar");
      function threshold() {
        var max = document.documentElement.scrollHeight - window.innerHeight;
        return max > 0 ? max * 0.05 : 40;
      }
      function onScroll() { if (bar) { bar.classList.toggle("scrolled", window.scrollY > threshold()); } }
      if ("scrollRestoration" in history) { history.scrollRestoration = "manual"; }
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("pageshow", function (e) { if (e.persisted) { window.scrollTo(0, 0); onScroll(); } });
      window.scrollTo(0, 0);
      onScroll();

      var io = typeof IntersectionObserver !== "undefined" && !reduce
        ? new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
          });
        }, { threshold: 0.15, rootMargin: "0px 0px -6% 0px" })
        : null;
      document.querySelectorAll("[data-reveal]").forEach(function (el) {
        if (io) { io.observe(el); } else { el.classList.add("in"); }
      });

      function applyLang(lang, animate) {
        var swap = function () {
          document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
          document.body.classList.toggle("lang-zh", lang !== "en");
          document.title = lang === "en" ? "Introducing Plainstruct." : "来认识一下『素构 Plainstruct』。";
          document.querySelectorAll("[data-zh]").forEach(function (el) {
            var txt = lang === "en" ? el.getAttribute("data-en") : el.getAttribute("data-zh");
            if (txt == null) return;
            if (txt.indexOf("<") !== -1) { el.innerHTML = txt; }
            else { el.textContent = txt; }
          });
          document.querySelectorAll(".lang-menu button").forEach(function (b) {
            b.classList.toggle("on", b.getAttribute("data-lang") === lang);
          });
          try { localStorage.setItem("plainstruct-intro-lang", lang); } catch (e) { }
        };
        var main = document.querySelector("main");
        if (!animate || reduce || !main) { swap(); return; }
        main.classList.add("switching");
        setTimeout(function () {
          swap();
          requestAnimationFrame(function () {
            main.classList.remove("switching");
          });
          /* safety net: never leave the page hidden when rAF is throttled
             (backgrounded tabs pause animation frames) */
          setTimeout(function () { main.classList.remove("switching"); }, 600);
        }, 200);
      }
      var saved = null;
      try { saved = localStorage.getItem("plainstruct-intro-lang"); } catch (e) { }
      applyLang(saved === "en" || saved === "zh" ? saved : "zh", false);

          return '<a class="am-pnav-link' + (current === path ? " cur" : "") + '" role="button" tabindex="0" data-doc="' + path + '">' + esc(label) + "</a>";
        }
        return "<ul>" +
          "<li>" + link("index.md", T ? "Home" : "首页") + "</li>" +
          '<li class="am-dir"><div class="am-pnav-dirrow"><button class="am-caret" type="button" aria-label="guide">' + svgFor("chevronDown", 11) + '</button><span class="am-pnav-dirname">guide</span></div>' +
          '<div class="am-sub"><div class="am-sub-in"><ul>' +
          link("guide/markdown.md", T ? "Markdown examples" : "Markdown 语法示例") +
          link("guide/quickstart.md", T ? "Quick start" : "快速开始") +
          "</ul></div></div></li>" +
          "<li>" + link("about.md", T ? "About Plainstruct" : "关于素构") + "</li>" +
          "</ul>";
      }
      function pagerHTML(lang, path) {
        var doc = DOCS[path || current], prev = null, next = null;
        Object.keys(DOCS).forEach(function (p) {
          var d = DOCS[p];
          if (d.order < doc.order && (!prev || d.order > DOCS[prev].order)) prev = p;
          if (d.order > doc.order && (!next || d.order < DOCS[next].order)) next = p;
        });
        var out = "";
        if (prev) out += '<a class="am-pgi prev" role="button" tabindex="0" data-doc="' + prev + '"><span class="tag">←</span>' + esc(titleOf(DOCS[prev].md[lang])) + "</a>";
        if (next) out += '<a class="am-pgi next" role="button" tabindex="0" data-doc="' + next + '">' + esc(titleOf(DOCS[next].md[lang])) + '<span class="tag">→</span></a>';
        return '<nav class="am-pager">' + out + "</nav>";
      }

      /* ---------- 渲染与切换 ---------- */
      var docTitleEl = document.getElementById("amDocTitle");
      var crumbsEl = document.getElementById("amCrumbs");
      var codeEl = document.getElementById("amCode");
      var pdocEl = document.getElementById("amPDoc");
      var pnavEl = document.getElementById("amPNav");
      var codeScroll = document.getElementById("amCodeScroll");
      var pScroll = document.getElementById("amPScroll");
      var bpvDoc = document.getElementById("amBPVDoc");
      var tpvDoc = document.getElementById("amTPVDoc");

      function applyTitles(lang) {
        Array.prototype.forEach.call(mock.querySelectorAll("[data-zh-title]"), function (el) {
          el.title = lang === "en" ? (el.getAttribute("data-en-title") || el.getAttribute("data-zh-title")) : el.getAttribute("data-zh-title");
        });
        Array.prototype.forEach.call(mock.querySelectorAll("[data-zh-placeholder]"), function (el) {
          el.setAttribute("placeholder", lang === "en" ? (el.getAttribute("data-en-placeholder") || el.getAttribute("data-zh-placeholder")) : el.getAttribute("data-zh-placeholder"));
        });
        Array.prototype.forEach.call(mock.querySelectorAll("[data-zh-value]"), function (el) {
          if ("value" in el) el.value = lang === "en" ? (el.getAttribute("data-en-value") || el.getAttribute("data-zh-value")) : el.getAttribute("data-zh-value");
        });
      }
      function renderAll(animate) {
        var lang = curLang();
        var doc = DOCS[current];
        var parsed = parseDoc(doc.md[lang]);
        var apply = function () {
          docTitleEl.textContent = parsed.title;
          crumbsEl.innerHTML = (doc.dir ? "<span>" + esc(doc.dir) + '</span><span class="sep">/</span>' : "") + '<span class="cur">' + esc(parsed.title) + "</span>";
          codeEl.innerHTML = edCode(doc.md[lang]);
          pdocEl.innerHTML = '<h1 class="am-pt">' + esc(parsed.title) + '</h1><div class="am-pb">' + pvBlocks(parsed.body) + "</div>" + pagerHTML(lang, current);
          /* 构建页与主题页的站点预览固定展示首页 */
          var homeParsed = parseDoc(DOCS["index.md"].md[lang]);
          var homeHTML = '<h1 class="am-pt">' + esc(homeParsed.title) + '</h1><div class="am-pb">' + pvBlocks(homeParsed.body) + "</div>" + pagerHTML(lang, "index.md");
          bpvDoc.innerHTML = homeHTML;
          tpvDoc.innerHTML = homeHTML;
          pnavEl.innerHTML = navHTML(lang);
          codeScroll.scrollTop = 0;
          pScroll.scrollTop = 0;
        };
        if (animate && !reduce) {
          codeEl.classList.add("out");
          pdocEl.classList.add("out");
          setTimeout(function () {
            apply();
            requestAnimationFrame(function () { codeEl.classList.remove("out"); pdocEl.classList.remove("out"); });
          }, 130);
        } else apply();
        applyTitles(lang);
      }
      function resolveDoc(href) {
        if (!href) return null;
        if (DOCS[href]) return href;
        var dir = DOCS[current].dir;
        var p = dir ? dir + "/" + href : href;
        return DOCS[p] ? p : null;
      }
      function openDoc(path) {
        if (!path || !DOCS[path] || path === current) return;
        current = path;
        Array.prototype.forEach.call(mock.querySelectorAll(".am-row[data-doc]"), function (r) {
          r.classList.toggle("on", r.getAttribute("data-doc") === path);
        });
        renderAll(true);
      }

      /* 活动栏视图切换:内容 / 站点 / 构建 / 主题 / 发布 */
      var views = {};
      Array.prototype.forEach.call(mock.querySelectorAll(".am-view"), function (v) {
        views[v.getAttribute("data-vp")] = v;
      });
      function setView(v) {
        if (!views[v] || mock.getAttribute("data-view") === v) return;
        mock.setAttribute("data-view", v);
        Object.keys(views).forEach(function (k) {
          var el = views[k];
          var on = k === v;
          el.hidden = !on;
          el.classList.remove("in");
          if (on && !reduce) {
            void el.offsetWidth;
            el.classList.add("in");
          }
        });
        Array.prototype.forEach.call(mock.querySelectorAll(".am-act-btn"), function (b) {
          b.classList.toggle("on", b.getAttribute("data-vp") === v);
        });
      }

      /* 点击委托:活动栏 / 文件树行 / guide 折叠 / 预览链接 / 上下篇 / 侧栏导航 */
      mock.addEventListener("click", function (e) {
        var t = e.target;
        var act = t.closest(".am-act-btn[data-vp]");
        if (act) { setView(act.getAttribute("data-vp")); return; }
        var caret = t.closest(".am-caret");
        if (caret) {
          var host = caret.closest(".am-dir");
          if (host) host.classList.toggle("closed");
          return;
        }
        if (t.closest("#amGuideRow")) {
          document.getElementById("amGuideDir").classList.toggle("closed");
          return;
        }
        var row = t.closest(".am-row[data-doc]");
        if (row) { openDoc(row.getAttribute("data-doc")); return; }
        var nav = t.closest("[data-doc]");
        if (nav) { e.preventDefault(); openDoc(resolveDoc(nav.getAttribute("data-doc"))); return; }
        if (t.closest("[data-ext]") || t.closest("#amFoot")) e.preventDefault();
      });
      mock.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" && e.key !== " ") return;
        var el = e.target.closest ? e.target.closest("[data-doc]") : null;
        if (el) { e.preventDefault(); openDoc(resolveDoc(el.getAttribute("data-doc"))); }
      });

      /* 显示模式:仅编辑 / 对照 / 仅预览。
         预览窗格按设计稿宽度 ≥900px 切换桌面侧栏,与真实 iframe 的断点一致 */
      var splitEl = document.getElementById("amSplit");
      var previewPane = splitEl.querySelector(".am-preview");
      var ratio = 0.52;
      function updatePreviewLayout() {
        var w = mode === "preview" ? 1148 : mode === "edit" ? 0 : 1148 * (1 - ratio) - 1;
        previewPane.classList.toggle("wide", w >= 900);
      }
      Array.prototype.forEach.call(mock.querySelectorAll(".am-mode"), function (b) {
        b.addEventListener("click", function () {
          mode = b.getAttribute("data-mode");
          splitEl.setAttribute("data-mode", mode);
          Array.prototype.forEach.call(mock.querySelectorAll(".am-mode"), function (x) {
            x.classList.toggle("on", x === b);
          });
          updatePreviewLayout();
        });
      });

      /* 分栏拖动 */
      var divider = document.getElementById("amDivider");
      var editorPane = document.getElementById("amEditorPane");
      var dragging = false;
      divider.addEventListener("pointerdown", function (e) {
        dragging = true;
        divider.classList.add("drag");
        divider.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      divider.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        var r = splitEl.getBoundingClientRect();
        ratio = Math.min(0.8, Math.max(0.2, (e.clientX - r.left) / r.width));
        editorPane.style.flexBasis = (ratio * 100).toFixed(2) + "%";
        updatePreviewLayout();
      });
      ["pointerup", "pointercancel"].forEach(function (t) {
        divider.addEventListener(t, function () {
          dragging = false;
          divider.classList.remove("drag");
        });
      });

      /* 滚动比例同步(编辑器 -> 预览) */
      codeScroll.addEventListener("scroll", function () {
        if (mode !== "split") return;
        var max = codeScroll.scrollHeight - codeScroll.clientHeight;
        if (max <= 0) return;
        var pMax = pScroll.scrollHeight - pScroll.clientHeight;
        if (pMax <= 0) return;
        pScroll.scrollTop = (codeScroll.scrollTop / max) * pMax;
      }, { passive: true });

      /* 语言切换联动(正文与提示文案由渲染函数负责) */
      var lastLang = curLang();
      if ("MutationObserver" in window) {
        new MutationObserver(function () {
          var l = curLang();
          if (l !== lastLang) { lastLang = l; renderAll(false); }
        }).observe(document.body, { attributes: true, attributeFilter: ["class"] });
      }

      /* 1440×900 设计稿等比缩放 */
      var stage = document.getElementById("appStage");
      function fit() {
        if (stage) stage.style.setProperty("--am-scale", String(stage.clientWidth / 1440));
      }
      if ("ResizeObserver" in window && stage) new ResizeObserver(fit).observe(stage);
      window.addEventListener("resize", fit);
      fit();
      updatePreviewLayout();

      renderAll(false);
    })();
  </script>
</body>

</html>
